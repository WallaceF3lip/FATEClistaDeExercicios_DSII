<!DOCTYPE html>
<html lang="PT-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/DesafioFinal.css">
    <title>FATEC</title>
</head>
<body>
    <header>
        <h1>Desafio Final</h1>
    </header>
    <main>
        <section id="creat">
            <h2>Lista de Alunos</h2>
            <article>
                <h3>Nome do Aluno:</h3>
                <div>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome do aluno">
                </div>
                <h3>Selecione o Curso</h3>
                <div>
                    <select name="curso" id="curso">
                        <option value="" disabled selected>Selecione um curso</option>
                        <option value="SI">Sistemas de Informação</option>
                        <option value="CC">Ciência da Computação</option>
                        <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
                        <option value="ADM">Administração</option>
                    </select>
                </div>

                <hr>

                <h3>Digite a nota 1:</h3>
                <div>
                    <input type="number" id="nota1" name="nota1" step="0.1" min="0" max="10" placeholder="Ex: 8.5">
                </div>
                <h3>Digite a nota 2:</h3>
                <div>
                    <input type="number" id="nota2" name="nota2" step="0.1" min="0" max="10" placeholder="Ex: 7.0">
                </div>

                <hr>

                <button id="btnCadastrar">Cadastrar aluno</button>

            </article>
        </section>
        <section id="read">
            <h2>Lista de Alunos Cadastrados</h2>
            <article>
                <table>
                    <thead id="alunosCadastradosHead">
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Curso</th>
                            <th scope="col">Média</th>
                            <th scope="col">Nota 1</th>
                            <th scope="col">Nota 2</th>
                            <th scope="col">Situação</th>
                        </tr>
                    </thead>
                    <tbody id="alunosCadastradosBody">
                       
                    </tbody>
                </table>
            </article>
        </section>
    </main>
</body>
<script src="../Js/desafioFinal.js"></script>
</html>
